<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GalaxeAI Chat</title>
  <link rel="icon" type="image/x-icon" href="icono.ico" />
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #161b22;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #30363d;
    }

    header img {
      width: 24px;
      height: 24px;
      vertical-align: middle;
      margin-right: 8px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 16px;
    }

    .user-bubble {
      align-self: flex-end;
      background-color: #238636;
      color: white;
    }

    .ai-bubble {
      align-self: flex-start;
      background-color: #21262d;
      border: 1px solid #30363d;
    }

    .ai-image {
      max-width: 60%;
      border-radius: 10px;
      border: 1px solid #30363d;
      align-self: flex-start;
    }

    #input-area {
      display: flex;
      padding: 10px;
      background-color: #161b22;
      border-top: 1px solid #30363d;
    }

    #mensaje {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      background-color: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 8px;
    }

    #input-area button {
      padding: 12px 16px;
      margin-left: 10px;
      background-color: #238636;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0.4;
      pointer-events: none;
    }

    #placeholder img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }

    #placeholder h1 {
      margin: 0;
      font-size: 26px;
      color: #5d52fc;
    }

    #placeholder p {
      margin-top: 4px;
      font-size: 14px;
      color: #8b949e;
    }

    @media (max-width: 600px) {
      header { font-size: 18px; padding: 12px; }
      #chat { padding: 12px; gap: 8px; }
      .bubble { font-size: 15px; padding: 10px 12px; }
      #mensaje { font-size: 14px; padding: 10px; }
      #input-area button { font-size: 14px; padding: 10px 12px; }
      #placeholder h1 { font-size: 22px; }
      #placeholder img { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="icono.ico" alt="Icono GalaxeAI" />
    GalaxeAI Chat
  </header>

  <div id="chat">
    <div id="placeholder">
      <img src="icono.ico" alt="GalaxeAI" />
      <h1>GalaxeAI</h1>
      <p>Beta Tester Mode</p>
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje..." />
    <button onclick="enviar()">Enviar</button>
    <button onclick="nuevoChat()" style="background-color:#30363d;">Nuevo chat</button>
  </div>

  <script>
    const chatDiv = document.getElementById("chat");
    const mensajeInput = document.getElementById("mensaje");
    let messages = [];

    function addBubble(content, role) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role === "user" ? "user-bubble" : "ai-bubble"}`;
      bubble.textContent = content;
      chatDiv.appendChild(bubble);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      return bubble;
    }

    function addImage(url) {
      const img = document.createElement("img");
      img.src = url;
      img.className = "ai-image";
      chatDiv.appendChild(img);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function escribirGradualmente(texto, burbuja) {
      burbuja.textContent = "";
      for (let i = 0; i < texto.length; i++) {
        burbuja.textContent += texto[i];
        chatDiv.scrollTop = chatDiv.scrollHeight;
        await new Promise(r => setTimeout(r, 12));
      }
    }

    async function enviar() {
      const mensaje = mensajeInput.value.trim();
      if (!mensaje) return;

      const placeholder = document.getElementById("placeholder");
      if (placeholder) placeholder.style.display = "none";

      messages.push({ role: "user", content: mensaje });
      addBubble(mensaje, "user");
      mensajeInput.value = "";

      const aiBubble = addBubble("", "assistant");

      try {
        if (mensaje === "/ft") {
          // Mostrar la imagen directamente sin llamar backend (para test)
          aiBubble.remove();
          addImage("https://fabiano2510.github.io/web/galaxe.jpg");
          // También podrías hacer fetch y esperar respuesta real si quieres.
        } else {
          const response = await fetch("https://galaxe.onrender.com/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });

          if (!response.ok) throw new Error("Error al conectar con el servidor");

          const data = await response.json();

          if (data.response) {
            messages.push({ role: "assistant", content: data.response });
            await escribirGradualmente(data.response, aiBubble);
          }
          if (data.image_url) {
            addImage(data.image_url);
          }
        }
      } catch (error) {
        aiBubble.textContent = "⚠️ Error: " + error.message;
      }
    }


    function nuevoChat() {
      messages = [];
      chatDiv.innerHTML = `
        <div id="placeholder">
          <img src="icono.ico" alt="GalaxeAI" />
          <h1>GalaxeAI</h1>
          <p>Beta Tester Mode</p>
        </div>
      `;
    }

    mensajeInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") enviar();
    });
  </script>
</body>
</html>
