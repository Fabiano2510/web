<!DOCTYPE html>
<html>
<head><title>Demo IA</title></head>
<body>
  <h2>Mini IA</h2>
  <input id="prompt" placeholder="Escribe algo..." />
  <button onclick="enviar()">Enviar</button>
  <p><strong>Respuesta:</strong> <span id="respuesta"></span></p>

  <script>
    async function enviar() {
      const prompt = document.getElementById("prompt").value;
      const res = await fetch("https://01fccf08b020.ngrok-free.app/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt })
      });
      const data = await res.json();
      document.getElementById("respuesta").textContent = data.response;
    }
  </script>
</body>
</html>
