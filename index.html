<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GalaxeAI Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #161b22;
      padding: 1rem;
      text-align: center;
      font-size: 1.6rem;
      font-weight: bold;
      border-bottom: 1px solid #30363d;
      color: #58a6ff;
      flex-shrink: 0;
    }

    #chat {
      flex: 1 1 auto;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 70px - 60px); /* input + header */
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
      display: inline-block;
    }

    .user-bubble {
      align-self: flex-end;
      background-color: #238636;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai-bubble {
      align-self: flex-start;
      background-color: #21262d;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
    }

    #input-container {
      height: 70px;
      display: flex;
      padding: 10px;
      background-color: #161b22;
      border-top: 1px solid #30363d;
      box-sizing: border-box;
      position: sticky;
      bottom: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    #mensaje {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #30363d;
      background-color: #0d1117;
      color: white;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 12px 16px;
      font-size: 16px;
      background-color: #238636;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2ea043;
    }

    /* Ajustes para móviles */
    @media (max-width: 600px) {
      #chat {
        padding: 10px;
        max-height: calc(100vh - 70px - 50px);
      }

      .bubble {
        max-width: 100%;
        font-size: 14px;
        padding: 10px 14px;
      }

      #input-container {
        height: 60px;
        padding: 8px;
      }

      #mensaje {
        font-size: 14px;
        padding: 10px;
      }

      button {
        padding: 10px 14px;
        font-size: 14px;
        margin-left: 6px;
      }
    }
  </style>
</head>
<body>
  <header>GalaxeAI Chat Beta</header>

  <div id="chat"></div>

  <div id="input-container">
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje..." />
    <button onclick="enviar()">Enviar</button>
  </div>

  <script>
    const chatDiv = document.getElementById("chat");
    const mensajeInput = document.getElementById("mensaje");
    let messages = [];

    function addBubble(content, role) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role === "user" ? "user-bubble" : "ai-bubble"}`;
      bubble.textContent = content;
      chatDiv.appendChild(bubble);
      chatDiv.scrollTop = chatDiv.scrollHeight;
      return bubble;
    }

    async function escribirGradualmente(texto, burbuja) {
      burbuja.textContent = "";
      for (let i = 0; i < texto.length; i++) {
        burbuja.textContent += texto[i];
        chatDiv.scrollTop = chatDiv.scrollHeight;
        await new Promise(r => setTimeout(r, 12));
      }
    }

    async function enviar() {
      const mensaje = mensajeInput.value.trim();
      if (!mensaje) return;

      messages.push({ role: "user", content: mensaje });
      addBubble(mensaje, "user");
      mensajeInput.value = "";

      const aiBubble = addBubble("", "assistant");

      try {
        const response = await fetch("http://localhost:8000/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) throw new Error("Error al conectar con el servidor");

        const data = await response.json();
        const respuesta = data.response;

        messages.push({ role: "assistant", content: respuesta });

        await escribirGradualmente(respuesta, aiBubble);
      } catch (error) {
        aiBubble.textContent = "⚠️ Error: " + error.message;
      }
    }

    mensajeInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") enviar();
    });
  </script>
</body>
</html>
